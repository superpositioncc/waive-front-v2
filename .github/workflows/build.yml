name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  FFMPEG_VERSION: 8.1.3
  FFMPEG_SHA256: 7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm (for the Intel slice of FFmpeg)
        run: brew install nasm

      - name: Build (universal)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build build -j 4

      - name: Check that nothing outside macOS is linked
        run: |
          status=0
          for f in build/bin/WAIVE-FRONT-V2 build/bin/*.vst3/Contents/MacOS/* build/bin/*.vst/Contents/MacOS/* build/bin/*.component/Contents/MacOS/*; do
            lipo -archs "$f"
            if otool -L "$f" | grep $'^\t' | grep -v -e '/System/' -e '/usr/lib/'; then
              echo "::error::$f links against a library that users will not have"
              status=1
            fi
          done
          exit $status

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application certificate in MACOS_CERTIFICATE"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Package (signed and notarised when the secrets are set)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/package-macos.sh build/bin package
          # One zip per format, as in earlier releases. ditto keeps permissions and
          # the stapled tickets; the artifact upload alone would not.
          mkdir release
          ditto -c -k --sequesterRsrc --keepParent package/WAIVE-FRONT-V2.app release/WAIVE-FRONT-V2.MacOS.App.zip
          ditto -c -k --sequesterRsrc --keepParent package/WAIVE-FRONT-V2.component release/WAIVE-FRONT-V2.MacOS.AU.zip
          ditto -c -k --sequesterRsrc --keepParent package/WAIVE-FRONT-V2.vst release/WAIVE-FRONT-V2.MacOS.VST.zip
          ditto -c -k --sequesterRsrc --keepParent package/WAIVE-FRONT-V2.vst3 release/WAIVE-FRONT-V2.MacOS.VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WAIVE-FRONT-V2-macOS
          path: release

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: ilammy/setup-nasm@v1

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils

      - name: Build FFmpeg (static, MSVC)
        shell: msys2 {0}
        run: |
          # MSYS's own link.exe would shadow the MSVC linker
          mv /usr/bin/link.exe /usr/bin/link-msys.exe
          curl -sSL -o ffmpeg.tar.xz https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c
          tar xf ffmpeg.tar.xz
          bash scripts/build-ffmpeg.sh "$PWD/ffmpeg-$FFMPEG_VERSION" "$PWD/ffmpeg-win" "" --toolchain=msvc --extra-cflags=-MT

      - name: Build
        run: |
          cmake -S . -B build -A x64 "-DWAIVE_FFMPEG_ROOT=${{ github.workspace }}/ffmpeg-win"
          cmake --build build --config Release

      - name: Check that no FFmpeg DLLs are needed
        shell: pwsh
        run: |
          $status = 0
          Get-ChildItem build/bin -Recurse -Include *.exe,*.dll,*.vst3 -File | ForEach-Object {
            $deps = dumpbin /dependents $_.FullName | Select-String -Pattern '^\s+\S+\.dll$' | ForEach-Object { $_.Line.Trim() }
            Write-Host "$($_.Name): $($deps -join ', ')"
            if ($deps | Where-Object { $_ -match '^(av|sw)' -or $_ -match '^(msvcp|vcruntime)' }) {
              Write-Host "::error::$($_.Name) needs a DLL that users will not have"
              $status = 1
            }
          }
          exit $status

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          # No standalone app: DPF leaves out its Windows audio fallback when built with MSVC,
          # so the .exe only starts where JACK is installed. Windows users use the plugins.
          Compress-Archive -Path build/bin/WAIVE-FRONT-V2-vst2.dll -DestinationPath release/WAIVE-FRONT-V2.Windows.VST.zip
          Compress-Archive -Path build/bin/WAIVE-FRONT-V2.vst3 -DestinationPath release/WAIVE-FRONT-V2.Windows.VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WAIVE-FRONT-V2-Windows
          path: release

  # Pushing a tag like v2.2 makes a draft release with all zips. Check it and publish it on GitHub.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip --repo "$GITHUB_REPOSITORY" \
            --draft --title "$GITHUB_REF_NAME" --generate-notes
